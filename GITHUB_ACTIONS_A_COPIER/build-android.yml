name: Build DroneAtlas Nova Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'content/**'
      - '**/*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'content/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Afficher les versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Préparer la plateforme Android
        run: |
          rm -rf android
          flutter create --platforms=android --org com.novateur221 --project-name droneatlas .
          python3 tool/configure_android.py

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee flutter-analyze.log
          analyze_status=${PIPESTATUS[0]}
          set -e

          # Certaines versions de Flutter peuvent renvoyer le code 1 pour de simples
          # informations de style malgré --no-fatal-infos. Seules les vraies erreurs
          # Dart doivent bloquer la compilation Android.
          if grep -Eq '^[[:space:]]*error[[:space:]]+•' flutter-analyze.log; then
            echo "Des erreurs Dart bloquantes ont été détectées."
            exit 1
          fi

          if [ "$analyze_status" -ne 0 ]; then
            echo "::warning::flutter analyze a renvoyé $analyze_status, mais aucune erreur Dart bloquante n'a été trouvée."
          fi

          echo "Analyse terminée : aucune erreur Dart bloquante."

      - name: Publier le rapport d’analyse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DroneAtlas-Nova-analyse
          retention-days: 7
          if-no-files-found: ignore
          path: flutter-analyze.log

      - name: Compiler l’APK Release
        run: |
          flutter build apk --release \
            --dart-define=EMAILJS_SERVICE_ID=service_726u54k \
            --dart-define=EMAILJS_TEMPLATE_ID=template_9y2rmzx \
            --dart-define=EMAILJS_PUBLIC_KEY=fxWkKI41fWVZAmts5 \
            --dart-define=DROBOT_API_URL="${{ secrets.DROBOT_API_URL }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            --dart-define=CERTIFICATION_API_URL="${{ secrets.CERTIFICATION_API_URL }}"

      - name: Compiler l’AAB Release
        run: |
          flutter build appbundle --release \
            --dart-define=EMAILJS_SERVICE_ID=service_726u54k \
            --dart-define=EMAILJS_TEMPLATE_ID=template_9y2rmzx \
            --dart-define=EMAILJS_PUBLIC_KEY=fxWkKI41fWVZAmts5 \
            --dart-define=DROBOT_API_URL="${{ secrets.DROBOT_API_URL }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            --dart-define=CERTIFICATION_API_URL="${{ secrets.CERTIFICATION_API_URL }}"

      - name: Publier les fichiers Android
        uses: actions/upload-artifact@v4
        with:
          name: DroneAtlas-Nova-3.0-Android
          retention-days: 30
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
