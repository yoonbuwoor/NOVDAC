[build]
  publish = "netlify/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/assets/**"]

[[headers]]
  for = "/.netlify/functions/certification-api"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
